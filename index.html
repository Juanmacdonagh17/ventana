<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F86A17;
  --vidrio:#FFAE00;
  --sol:#FFC61A;
  --paper:#EDF1EC;
  --ink:#16232E;
  --rule:#C4D3CA;
  --accent:#3B4CE0;
  --warm:#E2714A;
  --pad: 3cm;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"DM Mono",ui-monospace,monospace;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
/* ventana */
.ventana{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--sol);
  padding:clamp(6px,1.2vmin,16px);
}
.marco{
  height:100%;
  background:var(--vidrio);
  border:clamp(12px,2.4vmin,34px) solid var(--naranja);
  position:relative;
  transform:rotate(.35deg);
}
.riel{
  position:absolute;top:4%;left:1%;right:1%;
  height:clamp(7px,1.3vmin,18px);background:var(--naranja);
  transform:rotate(-.5deg);
}
.riel i{
  position:absolute;left:50%;top:-70%;
  width:clamp(18px,3vmin,42px);height:240%;
  background:var(--naranja);transform:translateX(-50%);
}
.travesano{
  position:absolute;left:-1%;right:-1%;top:46%;
  height:clamp(9px,1.8vmin,26px);background:var(--naranja);
  transform:rotate(-.6deg);
}
.alfeizar{
  position:absolute;left:0;right:0;bottom:0;height:15%;
  background:var(--naranja);transform:rotate(.4deg);
}

header{
  position:fixed;top:0;left:0;right:0;z-index:3;
  display:flex;align-items:baseline;gap:.9rem;
  padding:1.1rem 1.3rem;
  font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
}
header h1{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:600;font-size:1.05rem;letter-spacing:-.02em;text-transform:none;
}
header .who{opacity:.5;margin-left:auto}
header button{
  font:inherit;letter-spacing:.14em;text-transform:uppercase;
  background:none;border:none;color:var(--ink);opacity:.5;cursor:pointer;
  padding:0;border-bottom:1px solid currentColor;
}
header button:hover{opacity:1}

/* el taller: donde nacen los dibujos */
#studio{
  position:fixed;z-index:3;
  left:50%;transform:translateX(-50%);
  bottom:max(1.2rem,env(safe-area-inset-bottom));
  display:flex;align-items:flex-end;gap:1rem;
  padding:.9rem;
  background:rgba(237,241,236,.92);
  backdrop-filter:blur(6px);
  border:1px solid var(--rule);
  border-radius:2px;
  box-shadow:0 10px 30px -18px rgba(22,35,46,.5);
}
#pad{
  width:var(--pad);height:var(--pad);
  border:1px solid var(--ink);
  border-radius:1px;
  background:#fff;
  touch-action:none;cursor:crosshair;
  display:block;
}
.tools{display:flex;flex-direction:column;gap:.7rem;justify-content:flex-end}
.swatches{display:flex;gap:.35rem;align-items:center}
.sw{
  width:1.15rem;height:1.15rem;border-radius:50%;
  border:1px solid rgba(22,35,46,.25);cursor:pointer;padding:0;
}
.sw[aria-pressed="true"]{outline:1px solid var(--ink);outline-offset:2px}
input[type=color]{
  width:1.15rem;height:1.15rem;padding:0;border:1px solid rgba(22,35,46,.25);
  border-radius:50%;background:none;cursor:pointer;overflow:hidden;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.widths{display:flex;gap:.35rem;align-items:center}
.wd{
  width:1.6rem;height:1.15rem;border:1px solid var(--rule);background:#fff;
  cursor:pointer;display:grid;place-items:center;border-radius:1px;padding:0;
}
.wd[aria-pressed="true"]{border-color:var(--ink)}
.wd i{display:block;background:var(--ink);border-radius:99px}
.row{display:flex;gap:.5rem;align-items:center}
.btn{
  font:inherit;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.5rem .8rem;border-radius:1px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.35;cursor:default}
.hint{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.45}

/* puerta */
#gate{
  position:fixed;inset:0;z-index:9;
  background:var(--paper);
  display:grid;place-items:center;padding:1.5rem;
}
#gate .card{width:min(340px,100%);display:flex;flex-direction:column;gap:.85rem}
#gate h2{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:600;font-size:2.4rem;line-height:1;letter-spacing:-.03em;
}
#gate p{font-size:.75rem;opacity:.55;line-height:1.5}
#gate input[type=email],#gate input[type=password]{
  font:inherit;font-size:.85rem;padding:.65rem .7rem;
  border:1px solid var(--rule);border-radius:1px;background:#fff;color:var(--ink);
}
#gate input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.err{font-size:.72rem;color:var(--warm);min-height:1em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

@media (max-width:560px){
  :root{--pad:42vw}
  #studio{flex-direction:column;align-items:stretch;left:.8rem;right:.8rem;transform:none;gap:.7rem}
  .tools{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
  #pad{width:100%;height:42vw}
}
@media (prefers-reduced-motion:reduce){#sky{opacity:.9}}
</style>
</head>
<body>
<div class="ventana" aria-hidden="true">
  <div class="marco">
    <div class="riel"><i></i></div>
    <div class="travesano"></div>
    <div class="alfeizar"></div>
  </div>
</div>
<canvas id="sky"></canvas>

<header hidden id="bar">
  <h1>Ventana</h1>
  <span class="who" id="who"></span>
  <button id="out">salir</button>
</header>

<section id="studio" hidden aria-label="Taller de dibujo">
  <canvas id="pad" width="512" height="512" aria-label="Recuadro para dibujar"></canvas>
  <div class="tools">
    <div class="swatches" id="swatches" role="group" aria-label="Color"></div>
    <div class="widths" id="widths" role="group" aria-label="Grosor"></div>
    <div class="row">
      <button class="btn" id="send" disabled>Soltar</button>
      <button class="btn ghost" id="clear">Borrar</button>
    </div>
    <span class="hint">Enter para soltar</span>
  </div>
</section>

<div id="gate">
  <div class="card">
    <h2></h2>
    <p></p>
    <input type="email" id="email" placeholder="mail" autocomplete="username">
    <input type="password" id="pass" placeholder="contraseña" autocomplete="current-password">
    <button class="btn" id="in">Entrar</button>
    <span class="err" id="err"></span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, remove, query, orderByChild, startAt, endAt,
  onChildAdded, get, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ── PEGAR ACÁ LA CONFIG DE TU PROYECTO FIREBASE ──────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyA_jZRtfuMCZ8MzYVEfjn6j4xL1ott18Ug",
    authDomain: "ventana-59681.firebaseapp.com",
    databaseURL: "https://ventana-59681-default-rtdb.firebaseio.com",
    projectId: "ventana-59681",
    storageBucket: "ventana-59681.firebasestorage.app",
    messagingSenderId: "401756331859",
    appId: "1:401756331859:web:7e1e197b570f888112cba6",
    measurementId: "G-WQP9NGLB61"
  };
// ─────────────────────────────────────────────────────────────────

const VIDA_HORAS   = 1;    // cuánto sobrevive un dibujo
const CLON_CADA_MS = 10; // cada cuánto se clona
const CLONES_MAX   = 10;   // tope de copias por dibujo
const SPRITES_MAX  = 120;  // tope global, por performance

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);
const drawingsRef = ref(db, "drawings");

const $ = s => document.querySelector(s);
const lentos = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── entrar ───────────────────────────────────────────────────── */
$("#in").addEventListener("click", async () => {
  $("#err").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pass").value);
  } catch (e) {
    $("#err").textContent = e.code === "auth/invalid-credential"
      ? "Mail o contraseña no coinciden."
      : "No se pudo entrar: " + e.code;
  }
});
$("#pass").addEventListener("keydown", e => { if (e.key === "Enter") $("#in").click(); });
$("#out").addEventListener("click", () => signOut(auth));

let escuchando = false;
onAuthStateChanged(auth, user => {
  $("#gate").hidden   = !!user;
  $("#bar").hidden    = !user;
  $("#studio").hidden = !user;
  if (user) {
    $("#who").textContent = user.email.split("@")[0];
    if (!escuchando) { escuchando = true; limpiarViejos(); escuchar(); }
  }
});

/* ── el cielo: canvas donde todo vuela ────────────────────────── */
const sky = $("#sky"), sx = sky.getContext("2d");
let W, H;
const ajustar = () => {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  sky.width = W * d; sky.height = H * d;
  sx.setTransform(d, 0, 0, d, 0, 0);
};
addEventListener("resize", ajustar); ajustar();

const bandadas = []; // { sprite, clones, proximo }
const sprites  = [];

function nacer(bandada) {
  if (sprites.length >= SPRITES_MAX) return;
  const orbita = Math.random() < 0.45;
  const s = {
    img: bandada.img,
    escala: 0.55 + Math.random() * 0.6,
    rot: Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * (orbita ? 0.004 : 0.012),
    modo: orbita ? "orbita" : "vuelo"
  };
  if (orbita) {
    s.cx = W * (0.15 + Math.random() * 0.7);
    s.cy = H * (0.15 + Math.random() * 0.7);
    s.r  = 60 + Math.random() * Math.min(W, H) * 0.28;
    s.ang = Math.random() * Math.PI * 2;
    s.vang = (Math.random() < 0.5 ? -1 : 1) * (0.0022 + Math.random() * 0.0035);
    s.dx = (Math.random() - 0.5) * 0.22;
    s.dy = (Math.random() - 0.5) * 0.22;
  } else {
    s.x = Math.random() * W; s.y = Math.random() * H;
    const a = Math.random() * Math.PI * 2, v = 1.6 + Math.random() * 1.9;
    s.vx = Math.cos(a) * v; s.vy = Math.sin(a) * v;
  }
  sprites.push(s);
  bandada.clones++;
}

let ultimo = performance.now();
function cuadro(t) {
  const dt = Math.min((t - ultimo) / 16.67, 3); ultimo = t;

  // estela: en vez de borrar del todo, desvanecemos
  // sx.globalCompositeOperation = "destination-out";
  // sx.fillStyle = `rgba(0,0,0,${lentos ? 1 : 0.075})`;
  // sx.fillRect(0, 0, W, H);
  // sx.globalCompositeOperation = "source-over";
     sx.clearRect(0, 0, W, H);

  for (const b of bandadas) {
    if (b.clones < CLONES_MAX && t > b.proximo) {
      nacer(b); b.proximo = t + CLON_CADA_MS;
    }
  }

  for (const s of sprites) {
    let x, y;
    if (s.modo === "vuelo") {
      s.x += s.vx * dt; s.y += s.vy * dt;
      const m = 90 * s.escala;
      if (s.x < -m) s.x = W + m; if (s.x > W + m) s.x = -m;
      if (s.y < -m) s.y = H + m; if (s.y > H + m) s.y = -m;
      x = s.x; y = s.y;
    } else {
      s.ang += s.vang * dt;
      s.cx += s.dx * dt; s.cy += s.dy * dt;
      if (s.cx < 0 || s.cx > W) s.dx *= -1;
      if (s.cy < 0 || s.cy > H) s.dy *= -1;
      x = s.cx + Math.cos(s.ang) * s.r;
      y = s.cy + Math.sin(s.ang) * s.r * 0.55;
    }
    s.rot += s.vrot * dt;
    const w = s.img.width * s.escala * 0.5;
    sx.save();
    sx.translate(x, y); sx.rotate(s.rot);
    sx.drawImage(s.img, -w / 2, -w / 2, w, w);
    sx.restore();
  }
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);

/* ── convertir trazos guardados en una imagen ─────────────────── */
function pintar(trazos, lado = 200) {
  const c = document.createElement("canvas");
  c.width = c.height = lado;
  const g = c.getContext("2d");
  g.lineCap = "round"; g.lineJoin = "round";
  for (const tr of trazos) {
    g.strokeStyle = tr.c; g.lineWidth = tr.w * lado;
    g.beginPath();
    for (let i = 0; i < tr.p.length; i += 2) {
      const px = tr.p[i] * lado, py = tr.p[i + 1] * lado;
      i === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
    }
    if (tr.p.length === 2) g.lineTo(tr.p[0] * lado + .1, tr.p[1] * lado);
    g.stroke();
  }
  return c;
}

/* ── sincronización ───────────────────────────────────────────── */
function corte() { return Date.now() - VIDA_HORAS * 3600e3; }

function escuchar() {
  const q = query(drawingsRef, orderByChild("createdAt"), startAt(corte()));
  onChildAdded(q, snap => {
    const d = snap.val();
    if (!d?.strokes) return;
    bandadas.push({ img: pintar(d.strokes), clones: 0, proximo: 0 });
  });
}

async function limpiarViejos() {
  try {
    const q = query(drawingsRef, orderByChild("createdAt"), endAt(corte()));
    const snap = await get(q);
    snap.forEach(hijo => remove(hijo.ref));
  } catch (e) { console.warn("no se pudo limpiar", e); }
}

/* ── el recuadro ──────────────────────────────────────────────── */
const pad = $("#pad"), px = pad.getContext("2d");
const LADO = 512;
let color = "#16232E", grosor = 0.028, trazos = [], actual = null;

px.lineCap = "round"; px.lineJoin = "round";

const COLORES = ["#16232E", "#3B4CE0", "#E2714A", "#12856B", "#B8298E", "#E4B63C"];
COLORES.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "sw"; b.style.background = c;
  b.setAttribute("aria-label", "color " + (i + 1));
  b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => { color = c; marcar("#swatches", b); };
  $("#swatches").append(b);
});
const libre = document.createElement("input");
libre.type = "color"; libre.value = "#7A3E9D";
libre.setAttribute("aria-label", "color a elección");
libre.oninput = () => { color = libre.value; marcar("#swatches", null); };
$("#swatches").append(libre);

[[0.014, 3], [0.028, 5], [0.055, 8]].forEach(([g, punto], i) => {
  const b = document.createElement("button");
  b.className = "wd"; b.setAttribute("aria-label", "grosor " + (i + 1));
  b.setAttribute("aria-pressed", i === 1);
  b.innerHTML = `<i style="width:${punto}px;height:${punto}px"></i>`;
  b.onclick = () => { grosor = g; marcar("#widths", b); };
  $("#widths").append(b);
});
function marcar(cont, el) {
  document.querySelectorAll(cont + " [aria-pressed]")
    .forEach(x => x.setAttribute("aria-pressed", x === el));
}

const punto = e => {
  const r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
};
pad.addEventListener("pointerdown", e => {
  pad.setPointerCapture(e.pointerId);
  actual = { c: color, w: grosor, p: punto(e) };
  trazos.push(actual); repintar();
});
pad.addEventListener("pointermove", e => {
  if (!actual) return;
  actual.p.push(...punto(e)); repintar();
});
addEventListener("pointerup", () => { actual = null; });

function repintar() {
  px.clearRect(0, 0, LADO, LADO);
  for (const tr of trazos) {
    px.strokeStyle = tr.c; px.lineWidth = tr.w * LADO;
    px.beginPath();
    for (let i = 0; i < tr.p.length; i += 2) {
      const x = tr.p[i] * LADO, y = tr.p[i + 1] * LADO;
      i === 0 ? px.moveTo(x, y) : px.lineTo(x, y);
    }
    if (tr.p.length === 2) px.lineTo(tr.p[0] * LADO + .1, tr.p[1] * LADO);
    px.stroke();
  }
  $("#send").disabled = trazos.length === 0;
}

function limpiarPad() { trazos = []; actual = null; repintar(); }
$("#clear").onclick = limpiarPad;

$("#send").onclick = async () => {
  if (!trazos.length) return;
  const carga = trazos.map(t => ({
    c: t.c, w: t.w,
    p: t.p.map(n => Math.round(n * 1000) / 1000)
  }));
  limpiarPad();
  try {
    await push(drawingsRef, {
      author: auth.currentUser.uid,
      createdAt: serverTimestamp(),
      strokes: carga
    });
  } catch (e) {
    console.error(e);
    $("#err").textContent = "No se pudo soltar el dibujo.";
  }
};

addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("#studio").hidden && document.activeElement.tagName !== "INPUT") {
    e.preventDefault(); $("#send").click();
  }
});
</script>
</body>
</html>
